name: Slide carosello ND

# Gira ogni giorno alle 03:00 UTC (05:00 in Italia), molto prima della
# pubblicazione delle 18:00, così se qualcosa si rompe c'è tutta la giornata
# per accorgersene. Si può lanciare anche a mano dalla tab Actions.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# due esecuzioni contemporanee si pestano i piedi sul push: una alla volta
concurrency:
  group: slide-carosello
  cancel-in-progress: false

# serve per committare i JPG nel repo
permissions:
  contents: write

jobs:
  slide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Installa Chromium
        run: npx playwright install --with-deps chromium

      - name: Leggi la coda Notion
        id: prepara
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node ci/prepara.js

      - name: Renderizza le slide
        if: steps.prepara.outputs.da_fare == '1'
        run: node render.js dati.json ./slides

      # I JPG nel repo sono solo la rete di sicurezza: la strada principale e'
      # l'upload diretto su Notion del passo successivo. Se il push non riesce
      # (re-run di una run vecchia, main andato avanti) il giro NON si ferma.
      - name: Committa i JPG
        if: steps.prepara.outputs.da_fare == '1'
        continue-on-error: true
        run: |
          git config user.name  "nd-carosello bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slides
          git commit -m "Slide: $(date -u +%Y-%m-%d)" || { echo "niente di nuovo da committare"; exit 0; }
          git fetch origin main
          git rebase origin/main || { git rebase --abort || true; echo "rebase non riuscito"; exit 1; }
          git push origin HEAD:main

      - name: Metti le slide nella pagina Notion
        if: steps.prepara.outputs.da_fare == '1'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node ci/pubblica.js

      - name: Segnala l'errore su Notion
        if: failure()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node ci/segnala-errore.js "il workflow è fallito"
